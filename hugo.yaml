baseURL: "https://UserChem.github.io/" # 【以后发布时改】换成你的 GitHub Pages 域名
languageCode: "en-us"
title: "Mr.Thiol's Lab" # 网站标题
theme: "PaperMod"      # 指定使用的主题

enableInlineShortcodes: true

# 开启 LaTeX 数学公式支持 (这对你很重要！)
params:
  math: true
  defaultTheme: auto # 自动跟随系统切换黑白模式
  ShowReadingTime: true
  ShowShareButtons: true
  profileMode:
    enabled: true
    title: "Hi, I'm Hongrui (Sam) Sheng"
    subtitle: "Junior, Chemistry @ Fudan University"
    imageUrl: "avatar.png" # 以后可以在这里填你的头像图片路径
    buttons:
      - name: Posts
        url: /posts/
      - name: CV
        url: /Hongrui_Sheng_FDU_CV.pdf
  assets:
    favicon: "favicon.png"           # 浏览器标签页图标 (16x16, 32x32)
    favicon16x16: "favicon.png"      # 指定小尺寸也用这张，浏览器会自动缩放
    favicon32x32: "favicon.png"      # 指定中尺寸
    apple_touch_icon: "favicon.png"  # iPhone/iPad 主屏幕图标 (需要高清)
    safari_pinned_tab: "favicon.png" # Safari 固定标签页

# 菜单栏配置
menu:
  main:
    - identifier: home   # 唯一标识符
      name: Home         # 显示的名字
      url: /             # 斜杠就代表首页
      weight: 5          # 权重越小越靠左，设为 5 保证它在最前面
    - identifier: about
      name: About
      url: /about/
      weight: 7
    - identifier: posts  # 你之前的 Research/Posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON # 必须加这个，用于生成搜索索引

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
